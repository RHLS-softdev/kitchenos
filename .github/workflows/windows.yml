name: Windows Build

on:
  workflow_dispatch:
  push:
    tags: ['kitchenos-*']

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python sidecar deps
        working-directory: core/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build sidecar (PyInstaller, Windows)
        working-directory: core/backend
        run: |
          pyinstaller --onefile --name kitchenos-server run.py

      - name: Install desktop npm deps
        working-directory: desktop
        run: npm install

      - name: Build Windows installer (NSIS)
        working-directory: desktop
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitchenos-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          EXE=$(ls desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          echo "uploading $EXE"
          gh release upload "${GITHUB_REF_NAME}" "$EXE" --clobber
