# One command to run the whole stack:
#
#   docker compose up --build
#
# Then open http://localhost:5173 and log in with the seeded demo account:
#   chef@meridian.test / demo-password-123
#
# What happens automatically, in order: Postgres starts and waits to be
# healthy -> the API container runs migrations -> seeds demo data (skipped
# if already present) -> starts the Flask dev server -> the frontend
# container starts Vite. No manual "docker compose exec" steps needed.
#
# All the environment values below are dev-only defaults so this works with
# zero setup. To use a real AI key (for the Flavour AI / forecast / voice
# features), copy .env.example to .env and set AI_API_KEY — docker compose
# picks up a .env file in this directory automatically.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitchenos
      POSTGRES_PASSWORD: kitchenos
      POSTGRES_DB: kitchenos
    volumes:
      - kitchenos_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchenos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./core/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kitchenos:kitchenos@db:5432/kitchenos
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (no default)}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-llama-3.3-70b-versatile}
      FLASK_APP: run.py
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./core/backend:/app
    # Migrations + seed both no-op safely if already applied/present, so
    # this is fine to run on every container start, not just the first.
    command: sh -c "flask db upgrade && python3 seed.py && flask run --host=0.0.0.0 --debug"

  web:
    build: ./core/frontend
    restart: unless-stopped
    environment:
      # Browser-side, so "localhost" (not the "api" service name) is
      # correct here — the browser reaches the API via the host port
      # mapping above, not the Docker-internal network.
      VITE_API_BASE_URL: http://localhost:5000
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./core/frontend:/app
      - /app/node_modules

volumes:
  kitchenos_pgdata:
